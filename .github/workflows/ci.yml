name: CI

# Tests every push to main and every pull request. Nothing here deploys: the
# shared app ships with an npm release (release.yml, deploy-app.yml), and a
# merge to main is previewed with Isolate on a daemon running main
# (docs/releasing.md, "The app ships with the release").

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Embedding model cache dir (read by src/memory/embedding-worker.ts).
      # Lives in the workspace so actions/cache can persist it across runs.
      BRANE_MODEL_CACHE: ${{ github.workspace }}/.cache/brane-models
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install expo dependencies
        run: cd expo && npm ci

      # Cache the bge-small-en-v1.5 model so tests don't re-download it from
      # HuggingFace on every run (the source of the intermittent 429s). The
      # model is pinned/immutable, so a static key is correct: the first run
      # populates the cache, later runs restore it and never hit the network.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ${{ env.BRANE_MODEL_CACHE }}
          key: hf-model-Xenova-bge-small-en-v1.5-v1

      - name: Build and verify precache
        run: npm run build && cd expo && node scripts/check-precache.mjs

      - name: Run tests
        run: node --test dist/test/*.test.js
