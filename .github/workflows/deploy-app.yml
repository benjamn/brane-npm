name: Deploy app

# Puts the web app of one published npm version on the shared app host (the
# `brane` worker in worker/wrangler.toml). The bytes come from the registry,
# not from a build: the deploy unpacks `npm pack <name>@<version>` and serves
# its expo/dist, so the shared app is exactly what the tarball every daemon
# installs carries. A merge to main deploys nothing; staging is Isolate on a
# daemon running main (docs/releasing.md, "The app ships with the release").
#
# The shared app serves the `latest` dist-tag and nothing else, so the version
# must be `latest` when this runs. release.yml dispatches it after an ordinary
# (not pre-release) publish. Run it by hand to redeploy after a Cloudflare
# failure, or to roll back: `npm dist-tag add <name>@<version> latest`, then
# dispatch that version.
#
# The Cloudflare token is a secret of the `app` environment, not of the
# repository, and the deploy job waits there for the operator's approval. A
# repository secret is readable by any workflow a pushed commit carries; this
# one is not, until the operator approves the job asking for it.
#
# Only ever dispatched, never called. A reusable workflow's `secrets` context
# holds only what its caller passes, even in a job that names an environment,
# so called from release.yml (0.3.12's first deploy) the token was empty;
# passing it would mean `secrets: inherit`, which hands over every repository
# secret. A dispatched run is a workflow of its own, and its job in `app`
# reads that environment's secret directly.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version to deploy, which must be the latest dist-tag (a leading v is ignored)
        required: true
        type: string

permissions:
  contents: read

jobs:
  # GitHub creates an environment a job names that does not exist yet, with no
  # protection rules, and the job would read whatever secret it holds without
  # waiting. So nothing deploys unless the app environment exists and has a
  # required reviewer. A token that cannot read it is a refusal too. This
  # guards against a mistake in the settings; against a pushed commit that
  # rewrites this file, only the reviewer itself does (docs/releasing.md).
  gate:
    name: Check the deploy waits for approval
    if: github.repository == 'benjamn/brane-npm'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require a reviewer on the app environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! reviewers=$(gh api "repos/$GITHUB_REPOSITORY/environments/app" \
              --jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length'); then
            echo "Could not read the app environment; it must exist, with a required reviewer, before anything deploys (docs/releasing.md)." >&2
            exit 1
          fi
          if [ "$reviewers" -lt 1 ]; then
            echo "The app environment has no required reviewer, so a deploy would not wait for approval (docs/releasing.md)." >&2
            exit 1
          fi
          echo "The app environment requires approval ($reviewers reviewer(s))."

  deploy:
    name: Deploy the app
    needs: gate
    if: github.repository == 'benjamn/brane-npm'
    runs-on: ubuntu-latest
    environment: app
    # Two deploys never race; the second waits for the first. On the job, so
    # the gate check of a second dispatch still runs while the first deploys.
    concurrency:
      group: deploy-app
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Right after a publish the registry can 404 the version, or still name
      # the previous one as latest, for seconds to a minute. Wait for both
      # rather than deploy what latest used to be.
      - name: Wait for the version to be latest on the registry
        env:
          VERSION: ${{ inputs.version }}
        run: |
          name=$(node -p 'require("./package.json").name')
          version="${VERSION#v}"
          for delay in 5 10 20 30 60 60 60; do
            published=$(npm view "$name@$version" version 2>/dev/null || true)
            latest=$(npm view "$name" dist-tags.latest 2>/dev/null || true)
            if [ "$published" = "$version" ] && [ "$latest" = "$version" ]; then
              echo "$name@$version is published and is latest."
              echo "NAME=$name" >> "$GITHUB_ENV"
              echo "VERSION=$version" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Registry has $name@$version: '${published}', latest: '${latest}'. Retrying in ${delay}s."
            sleep "$delay"
          done
          echo "$name@$version is not the latest dist-tag on the registry." >&2
          echo "The shared app serves latest only. To roll back, run" >&2
          echo "  npm dist-tag add $name@$version latest" >&2
          echo "and dispatch this workflow again." >&2
          exit 1

      # expo/dist is gitignored, so the checkout has none; the tarball's goes
      # where worker/wrangler.toml looks for it.
      - name: Unpack the published app
        run: |
          pack="$RUNNER_TEMP/pack"
          mkdir -p "$pack"
          (cd "$pack" && npm pack "$NAME@$VERSION" --silent)
          tar xzf "$pack"/*.tgz -C "$pack"
          unpacked=$(node -p 'const p = require(process.argv[1]); p.name + "@" + p.version' "$pack/package/package.json")
          if [ "$unpacked" != "$NAME@$VERSION" ]; then
            echo "The tarball says $unpacked, not $NAME@$VERSION." >&2
            exit 1
          fi
          if [ ! -f "$pack/package/expo/dist/index.html" ]; then
            echo "$NAME@$VERSION carries no expo/dist/index.html." >&2
            exit 1
          fi
          mkdir -p expo
          cp -R "$pack/package/expo/dist" expo/dist

      - name: Verify precache
        run: node expo/scripts/check-precache.mjs

      # wrangler at the version this checkout's lockfile pins, without
      # installing the whole project.
      - name: Deploy to Cloudflare Workers
        run: |
          wrangler=$(node -p 'require("./package-lock.json").packages["node_modules/wrangler"].version')
          cd worker && npx --yes "wrangler@$wrangler" deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
